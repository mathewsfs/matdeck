# Release automática a partir de uma tag: `vX.Y.Z` vira estável (Latest), `vX.Y.Z-beta.N` vira pré-release.
# Anexa o Flatpak (dist/MatDeck.flatpak); o texto vem da seção da versão no CHANGELOG.md.
# O cliente Android (android-client/) não entra nas releases por enquanto: o deck é acessado pelo navegador (ver ROADMAP.md).
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  flatpak:
    name: Flatpak
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: flatpak e flatpak-builder
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends flatpak flatpak-builder
      - name: Dependências do servidor (vão dentro do pacote)
        working-directory: server
        run: npm ci --omit=dev --no-audit --no-fund
      - name: Construir o bundle
        env:
          FLATPAK_BUILDER_ARGS: --disable-rofiles-fuse
        run: ./scripts/build-flatpak.sh
      - uses: actions/upload-artifact@v4
        with:
          name: flatpak
          path: dist/MatDeck.flatpak
          if-no-files-found: error

  publicar:
    name: Publicar release
    needs: [flatpak]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artefatos
      - name: Notas da versão a partir do CHANGELOG
        id: notas
        run: |
          versao="${GITHUB_REF_NAME#v}"
          awk -v v="$versao" '
            $0 ~ "^## \\[" v "\\]" { on = 1; next }
            on && /^## \[/ { exit }
            on { print }
          ' CHANGELOG.md > notas.md
          if [ ! -s notas.md ]; then
            echo "Sem seção para a versão $versao no CHANGELOG.md." > notas.md
          fi
          {
            echo ""
            echo "### Instalar"
            echo '```bash'
            echo "flatpak install --user MatDeck.flatpak"
            echo '```'
            echo "No tablet ou celular, abra \`http://<ip-do-pc>:8888\` no navegador e digite o PIN que aparece no gerenciador."
          } >> notas.md
      - uses: softprops/action-gh-release@v2
        with:
          name: MatDeck ${{ github.ref_name }}
          body_path: notas.md
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: artefatos/flatpak/MatDeck.flatpak
