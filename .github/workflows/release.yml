# Release automática a partir de uma tag: `vX.Y.Z` vira estável (Latest), `vX.Y.Z-beta.N` vira pré-release.
# Anexa o Flatpak (dist/MatDeck.flatpak) e o APK; o texto vem da seção da versão no CHANGELOG.md.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  flatpak:
    name: Flatpak
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: flatpak e flatpak-builder
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends flatpak flatpak-builder
      - name: Dependências do servidor (vão dentro do pacote)
        working-directory: server
        run: npm ci --omit=dev --no-audit --no-fund
      - name: Construir o bundle
        env:
          FLATPAK_BUILDER_ARGS: --disable-rofiles-fuse
        run: ./scripts/build-flatpak.sh
      - uses: actions/upload-artifact@v4
        with:
          name: flatpak
          path: dist/MatDeck.flatpak
          if-no-files-found: error

  apk:
    name: APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
        with:
          packages: platforms;android-33 build-tools;33.0.2
      - name: Gradle
        working-directory: android-client
        run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - run: cp android-client/app/build/outputs/apk/debug/app-debug.apk MatDeck-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: MatDeck-debug.apk
          if-no-files-found: error

  publicar:
    name: Publicar release
    needs: [flatpak, apk]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artefatos
      - name: Notas da versão a partir do CHANGELOG
        id: notas
        run: |
          versao="${GITHUB_REF_NAME#v}"
          awk -v v="$versao" '
            $0 ~ "^## \\[" v "\\]" { on = 1; next }
            on && /^## \[/ { exit }
            on { print }
          ' CHANGELOG.md > notas.md
          if [ ! -s notas.md ]; then
            echo "Sem seção para a versão $versao no CHANGELOG.md." > notas.md
          fi
          {
            echo ""
            echo "### Instalar"
            echo '```bash'
            echo "flatpak install --user MatDeck.flatpak     # servidor (Linux)"
            echo "adb install -r MatDeck-debug.apk           # cliente Android 4.4+ (opcional; o navegador também serve)"
            echo '```'
          } >> notas.md
      - uses: softprops/action-gh-release@v2
        with:
          name: MatDeck ${{ github.ref_name }}
          body_path: notas.md
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            artefatos/flatpak/MatDeck.flatpak
            artefatos/apk/MatDeck-debug.apk
